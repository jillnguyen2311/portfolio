<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 915 347"><title id="title">TEST360 teacher score synchronization</title><desc id="desc">A teacher selects a grading session and a destination term, subject and score column. The conversion preview shows source and rounded results. Review can return to inputs or continue to synchronization.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="915" height="347" fill="#fbf8ff" rx="14"/><rect x="29" y="39" width="166" height="51" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="112.0" y="69.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Open grading session</text><path d="M 195 65 H 227" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="227" y="39" width="189" height="51" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="321.5" y="61.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Select target term,</text><text x="321.5" y="78.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">subject and column</text><path d="M 416 65 H 448" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="448" y="39" width="175" height="51" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="535.5" y="61.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Set score method</text><text x="535.5" y="78.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and rounding</text><path d="M 623 65 H 653" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="653" y="39" width="210" height="51" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="758.0" y="61.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Compare source and</text><text x="758.0" y="78.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">converted results</text><path d="M 758 90 V 144" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 758 144 L 781 167 L 758 190 L 735 167 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 752 161 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="758" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Confirm target and results?</text><path d="M 735 167 H 322 V 90" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="481" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Adjust selections</text><path d="M 758 190 V 241" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="653" y="241" width="210" height="51" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="758.0" y="263.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Synchronize to</text><text x="758.0" y="280.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">selected grade column</text></svg>