<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1040 523"><title id="title">UNI360 registration BPMN</title><desc id="desc">Academic Affairs sets a section&#x27;s registration mode. Cohort assignment and student registration converge on section enrollment. Self-registration checks eligibility and seat availability. A full section can place eligible students on a waitlist.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="1040" height="523" fill="#fbf8ff" rx="14"/><rect x="16" y="24" width="1008" height="475" rx="0" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><rect x="16" y="24" width="114" height="475" rx="0" fill="#f1e7fb" stroke="#c8b4e5" stroke-width="1.4"/><path d="M 16 24 H 1024" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="85.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Academic</text><text x="73" y="103.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Affairs</text><path d="M 16 152 H 1024" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Student</text><path d="M 16 262 H 1024" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="377.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">UNI360</text><circle cx="156" cy="77" r="13" fill="#f0eafa" stroke="#663dc1" stroke-width="1.6"/><path d="M 169 77 H 182" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="182" y="51" width="160" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="262.0" y="73.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Configure section</text><text x="262.0" y="90.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and registration mode</text><path d="M 342 77 H 375" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 398 54 L 421 77 L 398 100 L 375 77 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 392 71 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="398" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Mode?</text><path d="M 421 77 H 489" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="455" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Cohort</text><rect x="489" y="51" width="163" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="570.5" y="82.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Select cohort class</text><path d="M 398 100 V 201 H 447" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="406" y="173" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Self-registration</text><rect x="447" y="175" width="177" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="535.5" y="197.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Select section</text><text x="535.5" y="214.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and submit</text><path d="M 535 227 V 284 H 435" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="253" y="265" width="182" height="50" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="344.0" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Check status, dates,</text><text x="344.0" y="303.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">prerequisite and conflict</text><path d="M 253 290 H 203 V 347" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 203 347 L 226 370 L 203 393 L 180 370 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 197 364 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="203" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Eligible?</text><path d="M 203 393 V 451 H 253" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="218" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">No</text><rect x="253" y="425" width="182" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="344.0" y="447.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Return the</text><text x="344.0" y="464.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">blocking reason</text><path d="M 435 451 H 455" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><circle cx="468" cy="451" r="13" fill="#f0eafa" stroke="#663dc1" stroke-width="3.6"/><path d="M 226 370 H 550" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="337" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Yes</text><path d="M 573 347 L 596 370 L 573 393 L 550 370 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 567 364 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="573" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Seat available?</text><path d="M 596 370 H 751" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="667" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Yes</text><path d="M 573 393 V 451 H 636" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="602" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Full</text><rect x="636" y="425" width="157" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="714.5" y="447.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Queue eligible</text><text x="714.5" y="464.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">student</text><path d="M 793 451 H 857 V 396" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="900" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Seat opens</text><path d="M 652 77 H 924 V 316 H 858 V 344" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="844" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Assign cohort members</text><rect x="751" y="344" width="214" height="52" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="858.0" y="375.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Record section enrollment</text><path d="M 965 370 H 988" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><circle cx="1001" cy="370" r="13" fill="#f0eafa" stroke="#663dc1" stroke-width="3.6"/></svg>