<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1030 555"><title id="title">SMS360 homeroom-record workflow</title><desc id="desc">The administrator selects the year and class. SMS360 opens an existing class-year notebook or creates one with its school-level template. The homeroom teacher records content and assigned leadership can review and comment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="1030" height="555" fill="#fbf8ff" rx="14"/><rect x="16" y="24" width="998" height="507" rx="0" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><rect x="16" y="24" width="114" height="507" rx="0" fill="#f1e7fb" stroke="#c8b4e5" stroke-width="1.4"/><path d="M 16 24 H 1014" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">School Admin</text><path d="M 16 130 H 1014" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="213.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">SMS360</text><path d="M 16 302 H 1014" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="352.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Homeroom</text><text x="73" y="370.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">teacher</text><path d="M 16 408 H 1014" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="466.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Assigned</text><text x="73" y="484.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">leadership</text><circle cx="156" cy="77" r="13" fill="#f0eafa" stroke="#663dc1" stroke-width="1.6"/><path d="M 169 77 H 182" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="182" y="51" width="164" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="264.0" y="73.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Filter by grade</text><text x="264.0" y="90.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and open a class</text><path d="M 346 77 H 374" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="374" y="51" width="197" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="472.5" y="73.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Set reviewer for a grade</text><text x="472.5" y="90.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">or individual class</text><path d="M 264 103 V 154" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="182" y="154" width="164" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="264.0" y="176.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Resolve class</text><text x="264.0" y="193.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and academic year</text><path d="M 346 180 H 391" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 414 157 L 437 180 L 414 203 L 391 180 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 408 174 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="414" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Notebook exists?</text><path d="M 437 180 H 659 V 202" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="494" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Yes</text><path d="M 414 203 V 253 H 444" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="430" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">No</text><rect x="444" y="227" width="159" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="523.5" y="249.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Create notebook with</text><text x="523.5" y="266.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">school-level template</text><path d="M 603 253 H 637 V 228 H 659" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="659" y="202" width="197" height="52" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="757.5" y="224.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Open same notebook</text><text x="757.5" y="241.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">when term changes</text><path d="M 757 254 V 329" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="659" y="329" width="197" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="757.5" y="351.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Edit entitled sections</text><text x="757.5" y="368.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and submit a record</text><path d="M 472 103 V 465 H 659" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="563" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Assigned reviewer</text><path d="M 757 381 V 439" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="659" y="439" width="230" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="774.0" y="461.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Review checkpoint and</text><text x="774.0" y="478.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">save final comment</text><path d="M 889 465 H 932" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><circle cx="945" cy="465" r="13" fill="#f0eafa" stroke="#663dc1" stroke-width="3.6"/><text x="560" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">The reviewer assignment controls who can edit the leadership comment.</text></svg>