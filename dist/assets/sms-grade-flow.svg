<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 820 405"><title id="title">Grade visibility flow</title><desc id="desc">Resolve school and term, check active configuration, then use the visibility flag or show as default.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="820" height="405" fill="#fbf8ff" rx="14"/><rect x="300" y="20" width="220" height="46" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="410.0" y="48.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Open term scores</text><path d="M 410 66 V 89" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="300" y="89" width="220" height="45" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="410.0" y="116.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Resolve school, year and term</text><path d="M 410 134 V 156" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 410 157 L 433 180 L 410 203 L 387 180 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 404 174 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="410" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Active configuration exists?</text><path d="M 387 180 H 168 V 255" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="248" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">No</text><path d="M 433 180 H 655 V 231" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="586" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Yes</text><rect x="65" y="255" width="206" height="47" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="168.0" y="283.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Show average by default</text><path d="M 655 232 L 678 255 L 655 278 L 632 255 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 649 249 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="655" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Show-average flag is on?</text><path d="M 632 255 H 486 V 327" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="536" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Yes</text><path d="M 678 255 H 769 V 327" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="747" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">No</text><rect x="372" y="327" width="210" height="46" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="477.0" y="355.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Include average in response</text><rect x="603" y="327" width="190" height="46" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="698.0" y="355.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Suppress average</text></svg>