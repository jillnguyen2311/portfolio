<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 920 525"><title id="title">UML sequence for updating grade visibility</title><desc id="desc">An administrator saves a policy in a client. The API validates role and scope, saves policy and audit if authorized, and sends a failure response otherwise.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="920" height="525" fill="#fbf8ff" rx="14"/><rect x="24" y="23" width="160" height="38" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="104.0" y="47.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">School admin</text><path d="M 104 61 V 497" fill="none" stroke="#7355a2" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="248" y="23" width="160" height="38" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="328.0" y="47.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Web / mobile</text><path d="M 328 61 V 497" fill="none" stroke="#7355a2" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="473" y="23" width="160" height="38" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="553.0" y="47.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Grade policy API</text><path d="M 553 61 V 497" fill="none" stroke="#7355a2" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="715" y="23" width="160" height="38" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="795.0" y="47.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Policy + audit store</text><path d="M 795 61 V 497" fill="none" stroke="#7355a2" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="57" y="180" width="809" height="277" rx="0" fill="none" stroke="#a58ac8" stroke-width="1.4"/><rect x="57" y="180" width="49" height="22" rx="0" fill="#ede4fa" stroke="#a58ac8" stroke-width="1.4"/><text x="81" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2b2040">alt</text><text x="115" y="198" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">[Authorized school administrator and valid term]</text><path d="M 57 366 H 866" fill="none" stroke="#7355a2" stroke-width="1.7" stroke-dasharray="6 5"/><text x="68" y="389" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">[Role or scope rejected]</text><path d="M 104 103 H 328" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="216.0" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Choose term and save rule</text><path d="M 328 145 H 553" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="440.5" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Send scoped update</text><path d="M 553 243 H 795" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="674.0" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Upsert policy and append audit</text><path d="M 795 283 H 553" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="674.0" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Saved policy</text><path d="M 553 321 H 328" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="440.5" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Updated effective visibility</text><path d="M 328 351 H 104" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="216.0" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Confirm saved state</text><path d="M 553 418 H 328" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="440.5" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Return permission error</text><path d="M 328 446 H 104" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="216.0" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2b2040">Show error; keep last saved state</text></svg>