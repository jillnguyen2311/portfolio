<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 905 355"><title id="title">LMS360 speaking practice flow</title><desc id="desc">A teacher configures either reading a supplied passage or speaking on a topic. The learner chooses the activity and sees the corresponding passage or topic instructions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="905" height="355" fill="#fbf8ff" rx="14"/><rect x="16" y="24" width="873" height="306" rx="0" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><rect x="16" y="24" width="114" height="306" rx="0" fill="#f1e7fb" stroke="#c8b4e5" stroke-width="1.4"/><path d="M 16 24 H 889" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="94.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Teacher</text><path d="M 16 170 H 889" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="73" y="247.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Student</text><rect x="151" y="70" width="189" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="245.5" y="92.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Create speaking</text><text x="245.5" y="109.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">practice activity</text><path d="M 340 96 H 367" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 390 73 L 413 96 L 390 119 L 367 96 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 384 90 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="390" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Practice type?</text><path d="M 413 96 H 457 V 66 H 490" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 457 96 V 130 H 490" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="490" y="43" width="164" height="46" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="572.0" y="71.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Set the reading passage</text><rect x="490" y="107" width="164" height="46" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="572.0" y="135.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Set the speaking topic</text><path d="M 654 66 H 703 V 213" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 654 130 H 703" fill="none" stroke="#7355a2" stroke-width="1.7"/><rect x="606" y="213" width="194" height="50" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="703.0" y="234.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Open available activity</text><text x="703.0" y="251.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">and read guidance</text><path d="M 606 238 H 509" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 486 215 L 509 238 L 486 261 L 463 238 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 480 232 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="486" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">Mode?</text><path d="M 463 238 H 348 V 214" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="154" y="189" width="194" height="50" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="251.0" y="210.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Read the supplied</text><text x="251.0" y="227.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">passage aloud</text><path d="M 486 261 V 294 H 348" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="154" y="269" width="194" height="50" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="251.0" y="290.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Speak freely on</text><text x="251.0" y="307.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">the selected topic</text></svg>