<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 870 383"><title id="title">eLib360 advanced search and access</title><desc id="desc">The advanced search starts with the new curriculum. Subject and series follow curriculum, grade follows education level. School-only material opens only with the required account.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7355a2"/></marker></defs><rect width="870" height="383" fill="#fbf8ff" rx="14"/><rect x="25" y="38" width="178" height="54" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="114.0" y="70.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Open advanced search</text><path d="M 203 65 H 236" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="236" y="38" width="183" height="54" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="327.5" y="61.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Set curriculum</text><text x="327.5" y="78.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Default: new</text><path d="M 419 65 H 450" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="450" y="38" width="176" height="54" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="538.0" y="61.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Refresh subject and</text><text x="538.0" y="78.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">textbook series</text><rect x="236" y="129" width="183" height="54" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="327.5" y="161.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Set education level</text><path d="M 419 156 H 450" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="450" y="129" width="176" height="54" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="538.0" y="161.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Refresh grade</text><path d="M 626 65 H 664 V 113 H 689" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 626 156 H 664 V 113" fill="none" stroke="#7355a2" stroke-width="1.7"/><rect x="689" y="86" width="155" height="54" rx="9" fill="#eee3ff" stroke="#a384dc" stroke-width="1.4"/><text x="766.5" y="109.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Search and select</text><text x="766.5" y="126.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">a result</text><path d="M 766 140 V 222 H 606" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 583 199 L 606 222 L 583 245 L 560 222 Z" fill="#f7efff" stroke="#663dc1" stroke-width="1.6"/><path d="M 577 216 l12 12 m-12 0 l12 -12" fill="none" stroke="#7355a2" stroke-width="1.7"/><text x="583" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2b2040">School-only?</text><path d="M 560 222 H 318 V 285" fill="none" stroke="#7355a2" stroke-width="1.7" marker-end="url(#arrow)"/><text x="418" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2040">Yes</text><rect x="228" y="285" width="180" height="52" rx="9" fill="#fff" stroke="#c8b4e5" stroke-width="1.4"/><text x="318.0" y="307.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2040">Check school</text><text x="318.0" y="324.5" text-anch